<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090a1c"/><stop offset="1" stop-color="#170c2b"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="95"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".4"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#9333ea"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#c4b5fd"/><stop offset="1" stop-color="#4338ca"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="430" cy="360" r="270" fill="#4f46e5" opacity=".8"/>
    <circle cx="1180" cy="660" r="300" fill="#c026d3" opacity=".55"/>
    <circle cx="930" cy="230" r="190" fill="#06b6d4" opacity=".45"/>
  </g>
  <g stroke="#fff" stroke-opacity=".05">
    <path d="M0 800H1600M0 880H1600M0 960H1600"/>
    <path d="M200 1000L520 760M800 1000V760M1400 1000L1080 760" />
  </g>

  <!-- back glass panel: product listing -->
  <g transform="translate(170 250)">
    <rect width="600" height="440" rx="36" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="36" y="36" width="160" height="14" rx="7" fill="#fff" opacity=".7"/>
    <rect x="36" y="64" width="100" height="10" rx="5" fill="#fff" opacity=".3"/>
    <circle cx="540" cy="56" r="22" fill="#fff" opacity=".18"/>
    <g fill="#fff">
      <rect x="36" y="110" width="250" height="290" rx="22" opacity=".1"/>
      <rect x="314" y="110" width="250" height="290" rx="22" opacity=".1"/>
    </g>
    <circle cx="161" cy="220" r="66" fill="url(#orb)"/>
    <rect x="410" y="160" width="58" height="120" rx="18" fill="url(#orb)"/>
    <g fill="#fff">
      <rect x="60" y="320" width="130" height="12" rx="6" opacity=".7"/>
      <rect x="60" y="346" width="80" height="10" rx="5" opacity=".35"/>
      <rect x="338" y="320" width="130" height="12" rx="6" opacity=".7"/>
      <rect x="338" y="346" width="80" height="10" rx="5" opacity=".35"/>
    </g>
    <rect x="212" y="336" width="54" height="34" rx="17" fill="#a78bfa"/>
    <rect x="490" y="336" width="54" height="34" rx="17" fill="#a78bfa"/>
  </g>

  <!-- phone -->
  <ellipse cx="1060" cy="860" rx="210" ry="26" fill="#000" opacity=".5" filter="url(#soft)"/>
  <g transform="rotate(-9 1040 500)">
    <rect x="880" y="150" width="330" height="660" rx="58" fill="#0c0c18" stroke="url(#edge)" stroke-width="3"/>
    <rect x="898" y="168" width="294" height="624" rx="44" fill="url(#screen)"/>
    <rect x="1000" y="188" width="90" height="26" rx="13" fill="#0c0c18"/>
    <rect x="924" y="250" width="242" height="250" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".35"/>
    <path d="M985 410a60 60 0 0 1 120 0" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <rect x="968" y="396" width="34" height="62" rx="14" fill="#fff"/>
    <rect x="1088" y="396" width="34" height="62" rx="14" fill="#fff"/>
    <rect x="924" y="526" width="242" height="96" rx="24" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".25"/>
    <rect x="948" y="552" width="120" height="12" rx="6" fill="#fff" opacity=".85"/>
    <rect x="948" y="578" width="74" height="10" rx="5" fill="#fff" opacity=".45"/>
    <rect x="924" y="644" width="242" height="66" rx="33" fill="#fff"/>
    <rect x="990" y="671" width="110" height="12" rx="6" fill="#6d28d9"/>
    <rect x="898" y="168" width="294" height="300" rx="44" fill="#fff" opacity=".06"/>
  </g>

  <!-- floating glass orb -->
  <circle cx="1330" cy="270" r="74" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="1306" cy="246" r="18" fill="#fff" opacity=".5"/>
  <rect x="1240" y="470" width="180" height="120" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="1290" cy="530" r="24" fill="#22d3ee" opacity=".85"/>
  <rect x="1328" y="514" width="66" height="10" rx="5" fill="#fff" opacity=".7"/>
  <rect x="1328" y="536" width="44" height="8" rx="4" fill="#fff" opacity=".35"/>
</svg>
